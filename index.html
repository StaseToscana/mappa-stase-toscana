    header {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    header img { height: 40px; width: auto; }

    #btn-geolocate {
      background: white;
      color: #CC0000;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-family: 'League Spartan', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    #btn-geolocate:hover { background: #fff3f3; }

    #filtri {
      padding: 0 20px 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-filtro {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      padding: 5px 16px;
      font-family: 'League Spartan', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-filtro:hover, .btn-filtro.attivo {
      background: white;
      color: #CC0000;
      border-color: white;
    }

    #map { width: 100%; height: calc(100vh - 110px); }

    /* Cluster personalizzato */
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: rgba(204, 0, 0, 0.2) !important;
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: rgba(204, 0, 0, 0.8) !important;
      color: white !important;
      font-family: 'League Spartan', sans-serif !important;
      font-weight: 700 !important;
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      min-width: 240px;
      max-width: 280px;
      font-family: 'League Spartan', sans-serif;
    }
    .leaflet-popup-content { margin: 0; width: 100% !important; }

    .popup-img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }
    .popup-header {
      padding: 10px 14px 8px;
      font-weight: 700;
      font-size: 0.95rem;
      color: white;
      line-height: 1.3;
    }
    .popup-body {
      padding: 10px 14px 12px;
      font-size: 0.83rem;
      color: #333;
      line-height: 1.6;
      background: white;
    }
    .popup-cat {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .popup-quando { font-weight: 600; margin-bottom: 3px; color: #444; }
    .popup-luogo { color: #777; font-size: 0.78rem; margin-bottom: 10px; }
    .popup-btn {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      color: white !important;
      text-decoration: none !important;
      font-weight: 700;
      font-size: 0.78rem;
    }

    /* Legenda */
    #legenda {
      position: absolute;
      bottom: 40px;
      right: 10px;
      z-index: 1000;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.15);
      overflow: hidden;
      max-width: 200px;
    }
    #legenda-header {
      background: #CC0000;
      color: white;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.3px;
    }
    #legenda-body {
      padding: 8px 12px;
      display: none;
    }
    #legenda-body.aperta { display: block; }
    .legenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      font-size: 0.78rem;
      color: #333;
    }
    .legenda-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

      font-weight: 700;
      z-index: 1000;
      pointer-events: none;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 12px rgba(204,0,0,0.3);
      white-space: nowrap;
    }

    .raggio-label {
      background: transparent;
      border: none;
      color: #CC0000;
      font-family: 'League Spartan', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
    }

    'Evento gastronomico':        { bg: '#f59e0b', emoji: '🍷' },
    'Evento sportivo':            { bg: '#10b981', emoji: '⚽' },
    'Festa paesana':              { bg: '#ec4899', emoji: '🎪' },
    'Festival':                   { bg: '#f97316', emoji: '🎵' },
    'Fiera':                      { bg: '#14b8a6', emoji: '🏪' },
    'Mercato':                    { bg: '#84cc16', emoji: '🛍️' },
    'Mostra/Esposizione':         { bg: '#a855f7', emoji: '🎨' },
    'Rievocazione storica/Palio': { bg: '#92400e', emoji: '⚔️' },
    'Sagra':                      { bg: '#CC0000', emoji: '🍽️' },
    'Spettacolo teatrale':        { bg: '#7c3aed', emoji: '🎭' },
    'Serata/Discoteca':           { bg: '#4c1d95', emoji: '🪩' },
    'Altro':                      { bg: '#6b7280', emoji: '📌' },
  };

  function getCat(nome) {
    return CATEGORIE[nome] || { bg: '#6b7280', emoji: '📌' };
  }

  // Popola legenda
  const legendaBody = document.getElementById('legenda-body');
  Object.entries(CATEGORIE).forEach(([nome, cat]) => {
    const item = document.createElement('div');
    item.className = 'legenda-item';
    item.innerHTML = `<div class="legenda-dot" style="background:${cat.bg}"></div><span>${cat.emoji} ${nome}</span>`;
    legendaBody.appendChild(item);
  });

  function toggleLegenda() {
    const body = document.getElementById('legenda-body');
    const arrow = document.getElementById('legenda-arrow');
    body.classList.toggle('aperta');
    arrow.textContent = body.classList.contains('aperta') ? '▲' : '▼';
  }

  // Mappa minimal
  const map = L.map('map').setView([43.5, 11.0], 8);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  // Cluster group
  const clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
  });
  map.addLayer(clusterGroup);

  function creaIcona(cat) {
    const c = getCat(cat);
    return L.divIcon({
      className: '',
      html: `<div style="background:${c.bg};width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);font-size:16px;display:block;line-height:1">${c.emoji}</span></div>`,
      iconSize: [36, 36], iconAnchor: [18, 36], popupAnchor: [0, -38]
    });
  }

  const geocodeCache = {};
  async function geocodifica(indirizzo) {
    if (geocodeCache[indirizzo]) return geocodeCache[indirizzo];
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(indirizzo)}&limit=1`, { headers: { 'Accept-Language': 'it' } });
      const data = await res.json();
      if (data && data.length > 0) {
        const coords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        geocodeCache[indirizzo] = coords;
        return coords;
      }
    } catch(e) {}
    return null;
  }

  async function leggiEventi() {
    let records = [], offset = null;
    do {
      let url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?pageSize=100`;
      if (offset) url += `&offset=${offset}`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` } });
      const data = await res.json();
      records = records.concat(data.records || []);
      offset = data.offset || null;
    } while (offset);
    return records;
  }

  function isFuturo(r) {
    const d = r.fields['Data sort'] || r.fields['Data inizio'] || r.fields['Data inizio consec'] || r.fields['Data primo appuntamento'];
    if (!d) return true;
    return new Date(d) >= new Date(new Date().setHours(0,0,0,0));
  }

  function inPeriodo(fields, filtro) {
    if (filtro === 'tutti') return true;
    const d = fields['Data sort'] || fields['Data inizio'] || fields['Data inizio consec'] || fields['Data primo appuntamento'];
    if (!d) return false;
    const data = new Date(d);
    const oggi = new Date(); oggi.setHours(0,0,0,0);
    const domani = new Date(oggi); domani.setDate(oggi.getDate() + 1);
    const day = oggi.getDay();
    const sabato = new Date(oggi); sabato.setDate(oggi.getDate() + ((6 - day + 7) % 7));
    const lunedi = new Date(oggi); lunedi.setDate(oggi.getDate() + ((8 - day) % 7 || 7));
    const tra30 = new Date(oggi); tra30.setDate(oggi.getDate() + 30);
    if (filtro === 'oggi') return data >= oggi && data < domani;
    if (filtro === 'weekend') {
      const fineDomenica = new Date(sabato); fineDomenica.setDate(sabato.getDate() + 2);
      return data >= sabato && data < fineDomenica;
    }
    if (filtro === 'settimana') return data >= oggi && data < lunedi;
    if (filtro === 'mese') return data >= oggi && data <= tra30;
    return true;
  }

  let tuttiMarker = [];
  let filtroCorrente = 'tutti';

  function filtra(periodo, btn) {
    filtroCorrente = periodo;
    document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('attivo'));
    btn.classList.add('attivo');
    clusterGroup.clearLayers();
    let visibili = 0;
    tuttiMarker.forEach(item => {
      if (inPeriodo(item.fields, periodo)) {
        clusterGroup.addLayer(item.marker);
        visibili++;
      }
    });
    document.getElementById('contatore').textContent = `${visibili} eventi in Toscana`;
  }

  // Geolocalizzazione
  let raggioLayer = null;
  let markerUtente = null;

  function geolocate() {
    if (!navigator.geolocation) { alert('Geolocalizzazione non supportata dal browser.'); return; }
    const btn = document.getElementById('btn-geolocate');
    btn.textContent = '⏳ Ricerco...';
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      map.setView([lat, lon], 11);

      if (markerUtente) map.removeLayer(markerUtente);
      if (raggioLayer) map.removeLayer(raggioLayer);

      markerUtente = L.marker([lat, lon], {
        icon: L.divIcon({
          className: '',
          html: '<div style="width:16px;height:16px;background:#CC0000;border:3px solid white;border-radius:50%;box-shadow:0 0 0 4px rgba(204,0,0,0.3);"></div>',
          iconSize: [16,16], iconAnchor: [8,8]
        })
      }).addTo(map).bindPopup('<b>Sei qui</b>');

      raggioLayer = L.circle([lat, lon], {
        radius: 15000,
        color: '#CC0000', fillColor: '#CC0000',
        fillOpacity: 0.05, weight: 1.5, dashArray: '5,5'
      }).addTo(map);

      btn.textContent = '📍 Vicino a me';
    }, () => {
      btn.textContent = '📍 Vicino a me';
      alert('Non riesco a trovare la tua posizione.');
    });
  }

  async function init() {
    try {
      const records = await leggiEventi();
      const eventiFuturi = records.filter(isFuturo);
      let piazzati = 0;

      for (const record of eventiFuturi) {
        const f = record.fields;
        let coords = null;

        if (f['Lat'] && f['Lon']) {
          coords = { lat: parseFloat(f['Lat']), lon: parseFloat(f['Lon']) };
        } else {
          const indirizzo = f['Indirizzo completo'] || f['Comune'] || f['Indirizzo'];
          if (!indirizzo) continue;
          await new Promise(r => setTimeout(r, 1100));
          coords = await geocodifica(indirizzo);
        }

        if (!coords) continue;

        const nome      = f['Nome evento'] || 'Evento senza nome';
        const quando    = f['Riepilogo date'] || f['Data principale'] || '';
        const categoria = f['Categoria'] || 'Altro';
        const luogo     = [f['Comune'], f['Provincia'] ? `(${f['Provincia']})` : ''].filter(Boolean).join(' ');
        const mapsUrl   = f['Apri su Google Maps'] || `https://maps.google.com/?q=${encodeURIComponent(f['Indirizzo completo'] || '')}`;
        const locandina = f['Locandina'] && f['Locandina'][0] ? f['Locandina'][0].url : null;
        const cat       = getCat(categoria);

        document.getElementById('loading-msg').textContent = `Carico... ${piazzati + 1}/${eventiFuturi.length} eventi`;

        const imgHtml = locandina ? `<img src="${locandina}" class="popup-img" alt="${nome}" onerror="this.style.display='none'" />` : '';

        const popupHtml = `
          ${imgHtml}
          <div class="popup-header" style="background:${cat.bg}">${nome}</div>
          <div class="popup-body">
            <span class="popup-cat" style="background:${cat.bg}20;color:${cat.bg}">${cat.emoji} ${categoria}</span><br>
            ${quando ? `<div class="popup-quando">📅 ${quando}</div>` : ''}
            ${luogo ? `<div class="popup-luogo">📍 ${luogo}</div>` : ''}
            <a href="${mapsUrl}" target="_blank" class="popup-btn" style="background:${cat.bg}">🗺️ Google Maps</a>
            <a href="https://luis70695.softr.app/eventi-details/${record.id}" target="_blank" class="popup-btn" style="background:#333;margin-top:6px;display:inline-block;">📋 Vedi dettagli</a>
          </div>
        `;

        const marker = L.marker([coords.lat, coords.lon], { icon: creaIcona(categoria) })
          .bindPopup(popupHtml, { maxWidth: 280 });

        tuttiMarker.push({ fields: f, marker });

        if (inPeriodo(f, filtroCorrente)) {
          clusterGroup.addLayer(marker);
          piazzati++;
        }

        // Aggiorna contatore in tempo reale
        document.getElementById('contatore').textContent = `${piazzati} eventi caricati...`;
      }

      document.getElementById('loading').style.display = 'none';
      const visibili = tuttiMarker.filter(i => inPeriodo(i.fields, filtroCorrente)).length;
      document.getElementById('contatore').textContent = `${visibili} eventi in Toscana`;

    } catch(err) {
      console.error(err);
      document.getElementById('loading').innerHTML = `
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAByoAAANvCAYAAACChV2aAAAAtGVYSWZJSSoACAAAAAYAEgEDAAEAAAABAAAAGgEFAAEAAABWAAAAGwEFAAEAAABeAAAAKAEDAAEAAAACAAAAEwIDAAEAAAABAAAAaYcEAAEAAABmAAAAAAAAAGAAAAABAAAAYAAAAAEAAAAGAACQBwAEAAAAMDIxMAGRBwAEAAAAAQIDAACgBwAEAAAAMDEwMAGgAwABAAAA//8AAAKgBAABAAAAKgcAAAOgBAABAAAAbwMAAAAAAADff3GhAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAD82lUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPD94cGFja2V0IGJlZ2luPSfvu78nIGlkPSdXNU0wTXBDZWhpSHpyZVN6TlRjemtjOWQnPz4KPHg6eG1wbWV0YSB4bWxuczp4PSdhZG9iZTpuczptZXRhLyc+CjxyZGY6UkRGIHhtbG5zOnJkZj0naHR0cDovL3d3dy53My5vcmcvMTk5OS8wMi8yMi1yZGYtc3ludGF4LW5zIyc+CgogPHJkZjpEZXNjcmlwdGlvbiByZGY6YWJvdXQ9JycKICB4bWxuczpBdHRyaWI9J2h0dHA6Ly9ucy5hdHRyaWJ1dGlvbi5jb20vYWRzLzEuMC8nPgogIDxBdHRyaWI6QWRzPgogICA8cmRmOlNlcT4KICAgIDxyZGY6bGkgcmRmOnBhcnNlVHlwZT0nUmVzb3VyY2UnPgogICAgIDxBdHRyaWI6Q3JlYXRlZD4yMDI2LTA3LTAzPC9BdHRyaWI6Q3JlYXRlZD4KICAgICA8QXR0cmliOkRhdGE+eyZxdW90O2RvYyZxdW90OzomcXVvdDtEQUhHallwaDYybyZxdW90OywmcXVvdDt1c2VyJnF1b3Q7OiZxdW90O1VBSEVKOHhubmNnJnF1b3Q7LCZxdW90O2JyYW5kJnF1b3Q7OiZxdW90O0JBSERnbjR5RG1vJnF1b3Q7fTwvQXR0cmliOkRhdGE+CiAgICAgPEF0dHJpYjpFeHRJZD44NjQ3MmQ1Zi02ZGNhLTQzOWQtYjFhMS0zMjBhOGIwMGRiODk8L0F0dHJpYjpFeHRJZD4KICAgICA8QXR0cmliOkZiSWQ+NTI1MjY1OTE0MTc5NTgwPC9BdHRyaWI6RmJJZD4KICAgICA8QXR0cmliOlRvdWNoVHlwZT4yPC9BdHRyaWI6VG91Y2hUeXBlPgogICAgPC9yZGY6bGk+CiAgIDwvcmRmOlNlcT4KICA8L0F0dHJpYjpBZHM+CiA8L3JkZjpEZXNjcmlwdGlvbj4KCiA8cmRmOkRlc2NyaXB0aW9uIHJkZjphYm91dD0nJwogIHhtbG5zOmRjPSdodHRwOi8vcHVybC5vcmcvZGMvZWxlbWVudHMvMS4xLyc+CiAgPGRjOnRpdGxlPgogICA8cmRmOkFsdD4KICAgIDxyZGY6bGkgeG1sOmxhbmc9J3gtZGVmYXVsdCc+U3Rhc2UgLSAxPC9yZGY6bGk+CiAgIDwvcmRmOkFsdD4KICA8L2RjOnRpdGxlPgogPC9yZGY6RGVzY3JpcHRpb24+CjwvcmRmOlJERj4KPC94OnhtcG1ldGE+Cjw/eHBhY2tldCBlbmQ9J3InPz5xhPCvAAAgAElEQVR4nOzdB7gtVXk/YGsiaFRsMcYWYzQxmsjfEgVp9oKoicZeMWpiwa6xK8QerDFYsKERu0ZQbGjsirH3gGIUZvY53Eozzt5+/zV7H0TgXu45Z5dv9j7v+zy/59yroHvWWjNnrf3NrLnIRQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
